# Free preview backend. Supabase and Render Key Value are configured separately.
# Review all dashboard values before applying; no disk/database is created here.
services:
  - type: web
    name: resqnet-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --worker-class gthread --timeout 90 wsgi:application
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: APP_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: SEED_DEMO_DATA
        value: "False"
      - key: STORAGE_BACKEND
        value: supabase
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RATELIMIT_STORAGE_URI
        sync: false
      - key: TRUSTED_PROXY_HOPS
        sync: false
      - key: ADMIN_SECRET_CODE
        sync: false
