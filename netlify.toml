[build]
  publish = "frontend"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(self)"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
